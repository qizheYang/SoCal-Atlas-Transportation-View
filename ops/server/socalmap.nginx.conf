# Include inside the existing rehydratedwater.com HTTPS server block.
# Keep its existing root, TLS settings, and other locations unchanged.
location = /socalmap {
    return 308 /socalmap/;
}

# Old hashed assets remain available to already-open browser sessions.
location ^~ /socalmap/assets/ {
    alias /srv/www/socalmap/assets/;
    autoindex off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    error_page 404 =404 @socalmap_not_found;
}

location ^~ /socalmap/ {
    alias /srv/www/socalmap/current/;
    index index.html;
    autoindex off;
    # Explicit .gz files are binary payloads decoded by the application itself.
    # Do not add Content-Encoding or serve them through gzip_static.
    gzip off;
    gzip_static off;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    error_page 404 =404 @socalmap_not_found;
}

# Avoid an existing server-level SPA/error fallback returning HTML for missing data.
location @socalmap_not_found {
    return 404;
}
