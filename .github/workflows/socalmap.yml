name: SoCal Atlas CI and deployment

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-data.txt
      - name: Install locked dependencies
        run: |
          npm ci --legacy-peer-deps
          python -m pip install -r scripts/requirements-data.txt
      - name: Verify application and release tooling
        run: |
          npm test
          node --test scripts/test_materialize_road_data.mjs ops/*.test.mjs
          python -m unittest discover -s scripts -p 'test_*.py'
          python -m unittest discover -s ops/tests -p 'test_*.py'
      - name: Build at the production subpath
        run: npm run build -- --base=/socalmap/
      - name: Create release archive and checksum
        env:
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
        run: node ops/build-release.mjs --commit "$RELEASE_COMMIT" --run-id "$RELEASE_RUN_ID" --attempt "$RELEASE_ATTEMPT"
      - name: Save immutable release artifact
        id: artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: socalmap-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

  deploy:
    name: Deploy production
    needs: build
    if: >-
      github.repository == 'qizheYang/SoCal-Atlas-Transportation-View' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: https://rehydratedwater.com/socalmap/
    concurrency:
      group: socalmap-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: release
          merge-multiple: true
      - name: Validate packaged release
        env:
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
        run: |
          cd release
          sha256sum --check socalmap.tar.gz.sha256
          node --input-type=module - <<'JS'
          import { readFileSync } from 'node:fs';
          const release = JSON.parse(readFileSync('release.json', 'utf8'));
          const expected = `${process.env.RELEASE_COMMIT}-${process.env.RELEASE_RUN_ID}-${process.env.RELEASE_ATTEMPT}`;
          if (release.commit !== process.env.RELEASE_COMMIT || release.releaseId !== expected || !/^[a-f0-9]{64}$/.test(release.sha256) || readFileSync('socalmap.tar.gz.sha256', 'utf8').split(' ')[0] !== release.sha256) throw new Error('Release metadata does not match this workflow run');
          JS
      - name: Deploy with restricted SSH and verify public assets
        env:
          SOCALMAP_SSH_KEY: ${{ secrets.SOCALMAP_SSH_KEY }}
          SOCALMAP_KNOWN_HOSTS: ${{ secrets.SOCALMAP_KNOWN_HOSTS }}
          SOCALMAP_HOST: ${{ vars.SOCALMAP_HOST }}
          SOCALMAP_PORT: ${{ vars.SOCALMAP_PORT || '22' }}
          SOCALMAP_USER: ${{ vars.SOCALMAP_USER || 'socalmap-deploy' }}
          RELEASE_COMMIT: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          latest_main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$latest_main" != "$RELEASE_COMMIT" ]]; then
            echo 'Skipping superseded main commit; the newer workflow owns deployment.'
            echo 'Skipped: a newer commit is already on main.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          unset GH_TOKEN
          [[ "$SOCALMAP_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]] || { echo 'Invalid deployment host'; exit 1; }
          [[ "$SOCALMAP_PORT" =~ ^[0-9]+$ && "$SOCALMAP_PORT" -ge 1 && "$SOCALMAP_PORT" -le 65535 ]] || { echo 'Invalid deployment port'; exit 1; }
          [[ "$SOCALMAP_USER" == 'socalmap-deploy' ]] || { echo 'Unexpected deployment user'; exit 1; }
          [[ -n "$SOCALMAP_SSH_KEY" && -n "$SOCALMAP_KNOWN_HOSTS" ]] || { echo 'Deployment secrets are missing'; exit 1; }
          ssh_dir=$(mktemp -d)
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$SOCALMAP_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$SOCALMAP_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"
          unset SOCALMAP_SSH_KEY SOCALMAP_KNOWN_HOSTS
          ssh_options=(-i "$ssh_dir/key" -p "$SOCALMAP_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ssh_dir/known_hosts" -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          target="$SOCALMAP_USER@$SOCALMAP_HOST"
          node ops/smoke.mjs --origin https://rehydratedwater.com --baseline-out "$ssh_dir/baseline.json"
          ssh "${ssh_options[@]}" "$target" status > "$ssh_dir/status.json"
          prior_release=$(node --input-type=module - "$ssh_dir/status.json" <<'JS'
          import { readFileSync } from 'node:fs';
          const current = JSON.parse(readFileSync(process.argv[2], 'utf8')).current;
          if (current !== null && !/^[a-f0-9]{40}-[0-9]+-[0-9]+$/.test(current)) throw new Error('Invalid previous release');
          process.stdout.write(current ?? '');
          JS
          )
          release_id=$(node -p "JSON.parse(require('fs').readFileSync('release/release.json')).releaseId")
          archive_sha=$(node -p "JSON.parse(require('fs').readFileSync('release/release.json')).sha256")
          ssh "${ssh_options[@]}" "$target" "deploy $release_id $archive_sha" < release/socalmap.tar.gz
          if ! node ops/smoke.mjs --origin https://rehydratedwater.com --commit "$RELEASE_COMMIT" --baseline "$ssh_dir/baseline.json"; then
            if [[ -n "$prior_release" ]]; then
              echo 'Public asset checks failed; restoring the preceding release.'
              ssh "${ssh_options[@]}" "$target" "rollback $prior_release"
            else
              echo 'Public asset checks failed on the first deployment; no preceding release exists.'
            fi
            exit 1
          fi
          printf 'Deployed https://rehydratedwater.com/socalmap/ at `%s`.\n' "$RELEASE_COMMIT" >> "$GITHUB_STEP_SUMMARY"
